server {
    listen 80;
    server_name khalifadeveloper.com.br www.khalifadeveloper.com.br;

    # O certificado/redirect HTTPS deve ser gerenciado pelo Certbot ou hPanel.
    root /var/www/sipat/frontend;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Mantém React Router funcional ao atualizar uma rota diretamente.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # A API permanece privada em 127.0.0.1 e é exposta apenas pelo proxy TLS.
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uploads de vídeo são validados novamente pela API; este limite apenas
        # permite que o proxy os encaminhe. Mantenha-o alinhado ao .env.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 512m;
    }
}
